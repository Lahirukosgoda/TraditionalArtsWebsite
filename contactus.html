<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <nav>
        <div class="logo"></div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="artist.html">Artist</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contactus.html">Contact us</a></li>
        </ul>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search...">
            <button class="search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </nav>

    <div class="contact-container">
        <div class="contact-form">
            <h2>Contact Us</h2>
            <form onsubmit="showAlert(); return false;">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea rows="4" placeholder="Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <div class="contact-illustration">
            <img src="images/image.avif" alt="Contact Illustration">
        </div>
    </div>
    <script>
        function showAlert() {
            alert("Form submitted successfully!");
        }
    </script>


    <footer>
        <div class="socialIcons">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
        <div class="contact-info">
            <p>&copy; 2026 Traditional Arts Today. All Rights Reserved.</p>
            <p>Contact: <a href="tel:+1234567890">+1234567890</a> | Email: <a href="mailto:info@traditionalartstoday.com">info@traditionalartstoday.com</a></p>
        </div>
    </footer>

</body>
</html>
